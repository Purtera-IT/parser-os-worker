name: Deploy parser-os-worker to dev

# Push this file to Purtera-IT/parser-os-worker as
# .github/workflows/deploy-dev.yml
#
# Triggered on push to main.  Builds the worker image in ACR with all 3
# sibling repos (parser-os, parser-os-service, parser-os-worker) in the
# build context, then updates the Container Apps Job to the new digest.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   AZURE_TENANT_ID:       f793fa28-2504-447d-893e-f314c51c54de
#   AZURE_CLIENT_ID:       87c3259e-ed41-4a19-a4fc-86e1b575e31f
#   AZURE_SUBSCRIPTION_ID: cd493e42-9cd6-4849-975a-3fbeb7fd93d1
#
# Federated cred already added to platform-infra-github-actions:
#   github-parser-os-worker-ref-main
#   Subject: repo:Purtera-IT/parser-os-worker:ref:refs/heads/main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      parser_os_ref:
        description: parser-os ref to bundle (default main — includes skip-veto + silver channel)
        required: false
        default: main
      replaces:
        description: >-
          The parser-os ref you believe is deployed on dev right now. Required
          only when you are CHANGING it. Deploys are last-writer-wins and Azure
          records no intent, so a deploy that quietly replaces someone else's
          ref is indistinguishable from a feature that was never built. Naming
          what you are overwriting makes that a decision instead of an accident.
        required: false
        default: ""
      force_roll:
        description: >-
          Roll the warm worker even if a compile is in flight. Rolling kills
          whatever is running (it has, twice). Only set this when you know the
          running compile is expendable.
        required: false
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: purpulsedevacr
  ACR_REGISTRY: purpulsedevacr.azurecr.io
  IMAGE_NAME: parser-os-worker
  ENV_TAG: dev
  JOB_NAME: parser-os-worker-dev-eus2
  JOB_RG: purtera-dev-rg
  PARSER_OS_REPO: https://github.com/Purtera-IT/parser-os.git
  PARSER_OS_SERVICE_REPO: https://github.com/Purtera-IT/parser-os-service.git

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Must exceed the drain deadline below PLUS the ACR build ahead of it.
    # At 30 the two were equal, so the drain could never reach its own
    # deadline: the runner cancelled the job first, which skips the roll AND
    # the verify and leaves the deploy half-done while reporting "cancelled".
    timeout-minutes: 75
    steps:
      - name: Checkout parser-os-worker
        uses: actions/checkout@v4
        with:
          path: parser-os-worker

      - name: Checkout parser-os
        uses: actions/checkout@v4
        with:
          repository: Purtera-IT/parser-os
          ref: ${{ github.event.inputs.parser_os_ref || 'main' }}
          path: parser-os
          # parser-os is public: no credential needed. It used to pass
          # GH_REPO_TOKEN, which meant an expired PAT failed this checkout too —
          # widening a one-repo problem into a total deploy outage.

      - name: Checkout parser-os-service
        uses: actions/checkout@v4
        with:
          repository: Purtera-IT/parser-os-service
          ref: main
          path: parser-os-service
          # public since 2026-08-10: no credential needed, nothing left to expire

      - name: Checkout SowSmith
        # Dockerfile's `COPY SowSmith ./SowSmith` needs the repo present in build context.
        uses: actions/checkout@v4
        with:
          repository: Purtera-IT/SowSmith
          ref: main
          path: SowSmith
          # SowSmith is public: no credential needed (see parser-os above).

      - name: Capture parser-os SHA
        id: pos
        run: |
          SHA=$(git -C parser-os rev-parse HEAD)
          REF="${{ github.event.inputs.parser_os_ref || 'main' }}"
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Bundled parser-os $REF @ $SHA"

      - name: Slug for the parser-os ref (image tags cannot hold a slash)
        id: slug
        run: |
          REF="${{ github.event.inputs.parser_os_ref || 'main' }}"
          echo "slug=$(printf '%s' "$REF" | tr '/' '_' | tr -cd 'A-Za-z0-9._-')" >> $GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Guard — do not silently replace another agent's ref
        id: guard
        run: |
          # Dev is one mutable pointer and every deploy is last-writer-wins. When
          # two agents deploy different refs the loser's work vanishes with no
          # error anywhere -- it looks exactly like a feature that was never
          # built. That happened twice in two days: feat/deal-stage-organisation
          # went up 09-01 19:58 and was rolled back to a main image built 19
          # minutes EARLIER, and nothing anywhere said so.
          #
          # Each build now carries a `parseros-<ref>` tag, so the running image
          # can be asked which ref it came from. Changing that ref requires
          # naming what you are overwriting. This does not stop a deliberate
          # replacement -- it stops an accidental one.
          set -uo pipefail
          WANT="${{ github.event.inputs.parser_os_ref || 'main' }}"
          RUNNING_IMAGE=$(az containerapp show -n parser-os-worker-warm -g "${{ env.JOB_RG }}" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null | tr -d '\r')
          DIGEST="${RUNNING_IMAGE##*@}"
          CURRENT=""
          if [ -n "$DIGEST" ] && [ "$DIGEST" != "$RUNNING_IMAGE" ]; then
            TAGS=$(az acr manifest show-metadata --registry "${{ env.ACR_NAME }}" \
              --name "${{ env.IMAGE_NAME }}@$DIGEST" --query "tags" -o tsv 2>/dev/null | tr '\t\n' '  ')
            for t in $TAGS; do
              case "$t" in parseros-*) CURRENT="${t#parseros-}";; esac
            done
          fi

          if [ -z "$CURRENT" ]; then
            # "Unknown" must not mean "go ahead" on an automatic trigger. The
            # first version of this guard allowed it, and the very first push to
            # main after merging replaced feat/deal-stage-organisation on dev --
            # the exact regression the guard exists to prevent, caused by the
            # guard's own bootstrap path. Not knowing what you are about to
            # overwrite is the strongest reason not to overwrite it.
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::cannot tell which parser-os ref dev is running (image predates the parseros-<ref> tag). Refusing to replace it automatically. Skipping."
              echo "Dispatch this workflow once to stamp a tag and take ownership deliberately."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            echo "::warning::the running image carries no parseros-<ref> tag (built before this guard). A human dispatched this, so proceeding, and this deploy will stamp one."
            exit 0
          fi

          WANT_SLUG=$(printf '%s' "$WANT" | tr '/' '_' | tr -cd 'A-Za-z0-9._-')
          echo "dev currently runs parser-os ref: $CURRENT"
          echo "this deploy wants:                $WANT_SLUG"
          if [ "$CURRENT" = "$WANT_SLUG" ]; then
            echo "same ref — nothing being replaced."; exit 0
          fi

          ACK=$(printf '%s' "${{ github.event.inputs.replaces }}" | tr '/' '_' | tr -cd 'A-Za-z0-9._-')
          if [ "$ACK" = "$CURRENT" ]; then
            echo "replacing '$CURRENT' with '$WANT_SLUG', acknowledged."; exit 0
          fi

          # A push to main has no human behind it and cannot pass `replaces`.
          # Automatic deploys must never take dev away from a ref somebody chose
          # deliberately -- that is precisely how this feature was lost -- but
          # they also should not paint CI red for doing their job. Skip instead.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::warning::dev runs '$CURRENT' (deployed deliberately); a push-triggered deploy of '$WANT_SLUG' would replace it. Skipping."
            echo "To put '$WANT_SLUG' on dev, dispatch this workflow with replaces='$CURRENT'."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "::error::This deploy would replace parser-os ref '$CURRENT' with '$WANT_SLUG'."
          echo "Someone (or another agent) put '$CURRENT' on dev. Replacing it silently is how"
          echo "the deal-stage feature disappeared twice. If you mean to take it over, re-run"
          echo "with replaces='$CURRENT'. If you did not, deploy '$CURRENT' instead."
          exit 1

      - name: ACR build
        if: steps.guard.outputs.skip != 'true'
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image "${{ env.IMAGE_NAME }}:${{ env.ENV_TAG }}" \
            --image "${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:12}" \
            --image "${{ env.IMAGE_NAME }}:parseros-${{ steps.slug.outputs.slug }}" \
            --file parser-os-worker/Dockerfile \
            --build-arg "GIT_SHA=${{ github.sha }}" \
            --build-arg "PARSER_OS_SHA=${{ steps.pos.outputs.sha }}" \
            --build-arg "BUILD_LABEL=${{ steps.pos.outputs.ref }}" \
            --build-arg "CACHEBUST=${{ github.sha }}-${{ steps.pos.outputs.sha }}" \
            --no-format \
            .

      - name: Resolve THIS build's digest (immutable per-commit tag)
        if: steps.guard.outputs.skip != 'true'
        id: img
        run: |
          # Resolve the digest of the sha-<commit> tag THIS run just built — it is
          # unique to this commit, so the Job can never be pinned to a stale 'dev'
          # image (the previous bug used the mutable 'dev' tag and picked old ones).
          DIGEST=$(az acr repository show \
            --name ${{ env.ACR_NAME }} \
            --image "${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:12}" \
            --query digest -o tsv)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "Rolling ${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA:0:12} @ $DIGEST"

      - name: Roll Container Apps Job
        if: steps.guard.outputs.skip != 'true'
        run: |
          az containerapp job update \
            --name ${{ env.JOB_NAME }} \
            --resource-group ${{ env.JOB_RG }} \
            --image "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.img.outputs.digest }}"

      # The OIDC assertion is valid for ~5 minutes. The ACR build routinely runs
      # longer than that, so by the time the drain reaches storage the token has
      # already expired: AADSTS700024, "assertion valid from 07:27:51, expiry
      # 07:32:51, current time 07:40:22". Re-authenticate so the drain and the
      # roll run on a live token rather than the build's stale one.
      - name: Azure login (OIDC) — refresh after the build
        if: steps.guard.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Drain the warm worker before rolling it
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Rolling this Container App restarts it, killing whatever compile it is
          # running. That destroyed three compiles in one batch, and again on
          # 09-02 a recompile of 010215 was killed mid-run -- it wrote a manifest
          # and never an envelope, which reads downstream as "the compile did
          # nothing" rather than "the compile was killed".
          #
          # The first version of this step simply WAITED for an idle worker. On a
          # busy environment that window never opens: a deploy on 09-02 waited the
          # full 15 minutes while two unrelated deals compiled back to back, then
          # failed. Waiting for quiet cannot be relied on when work is continuous.
          #
          # So drain instead. The sentinel stops the worker taking the NEXT
          # message; the one it already holds finishes normally. Then we roll
          # against an idle process, and the sentinel is removed by a step that
          # always runs.
          set -uo pipefail
          if [ "${{ github.event.inputs.force_roll }}" = "true" ]; then
            echo "force_roll=true — rolling without draining. Whatever is compiling now will be killed."
            exit 0
          fi
          ACCT=purpulsedevstg01
          CONTAINER=orbitbrief-artifacts
          echo "drain requested by run ${{ github.run_id }} at $(date -u +%FT%TZ)" > /tmp/drain
          # A drain we cannot request is not a drain -- rolling anyway would kill
          # a compile while claiming to have drained. So fail loudly. But say
          # WHICH failure it was: this message used to blame a missing
          # "Storage Blob Data Contributor" role unconditionally, and printed
          # exactly that when the real error was an expired OIDC token. The
          # operator then re-checks RBAC that was already correct.
          if ! ERR=$(az storage blob upload --account-name "$ACCT" --container-name "$CONTAINER" \
                 --name control/parser-os-worker.drain --file /tmp/drain --overwrite \
                 --auth-mode login --only-show-errors -o none 2>&1); then
            echo "$ERR"
            case "$ERR" in
              *AADSTS700024*|*"not within its valid time range"*|*ExpiredToken*)
                echo "::error::the Azure credential expired before the drain could write its sentinel."
                echo "This is an auth LIFETIME problem, not a permissions problem -- do not go re-check RBAC."
                echo "The refresh-login step ahead of this one should have renewed it; check that it ran." ;;
              *AuthorizationPermissionMismatch*|*AuthorizationFailure*|*Forbidden*)
                echo "::error::the deploy identity lacks Storage Blob Data Contributor on $ACCT." ;;
              *)
                echo "::error::could not write the drain sentinel; the az error is printed above." ;;
            esac
            echo "Re-run with force_roll=true to roll anyway, accepting that the running compile dies."
            exit 1
          fi
          echo "drain sentinel written — worker will finish its current message and stop taking new ones"

          # Now wait only for the IN-FLIGHT compile, which is bounded by one
          # compile rather than by how busy the queue is.
          # Wait on PROGRESS, not on elapsed time. A 45-minute ceiling looked
          # generous until a real compile blew through it: 86 artifacts, 17,986
          # atoms, source_replay alone taking 33 minutes. It was perfectly
          # healthy, and the drain killed the deploy claiming it was "longer
          # than any healthy compile" -- a statement about compile duration that
          # this environment simply does not support.
          #
          # There is no duration that separates a big compile from a stuck one.
          # Progress does: a working compile keeps opening and closing stages, a
          # stuck one stops. So fail only when the stage signature has not moved
          # for STALL_LIMIT, with a generous absolute ceiling underneath the
          # job timeout as a backstop.
          STALL_LIMIT=900          # 15 min with no stage change = stuck
          DEADLINE=$(( $(date +%s) + 3600 ))
          LAST_SIG=""
          LAST_MOVE=$(date +%s)
          while :; do
            LOGS=$(az containerapp logs show -n parser-os-worker-warm -g "${{ env.JOB_RG }}" \
                     --tail 40 --only-show-errors 2>/dev/null || true)
            BUSY=$(printf '%s' "$LOGS" | grep -c 'compile_stage_heartbeat\|compile_stage_started' || true)
            DRAINED=$(printf '%s' "$LOGS" | grep -c 'Drain sentinel present' || true)
            if [ "${DRAINED:-0}" -gt 0 ] || [ "${BUSY:-0}" -eq 0 ]; then
              echo "worker is drained — safe to roll."; exit 0
            fi
            # `|| true`: the step runs under bash -e with pipefail, and grep exits 1
            # when the worker is IDLE (no stage lines in the tail). Without it the
            # drain died 5s after writing its sentinel -- on exactly the quiet
            # worker a deploy is supposed to roll straight through.
            # Liveness, not stage churn: one long stage (a 35-artifact deal
            # parsing 9 MB of spreadsheets sat in parse_artifacts for 30+
            # minutes, 2026-09-04) heartbeats every 30 s with a rising
            # elapsed_s. A compile that heartbeats is alive; only a compile
            # whose heartbeat AND stage have both frozen is stuck.
            SIG=$(printf '%s' "$LOGS" | grep -o '"stage": "[a-z_]*"\|"elapsed_s": [0-9.]*' | tail -3 | tr -d '\n' || true)
            if [ "$SIG" != "$LAST_SIG" ]; then
              LAST_SIG="$SIG"; LAST_MOVE=$(date +%s)
            fi
            STALLED=$(( $(date +%s) - LAST_MOVE ))
            if [ "$STALLED" -ge "$STALL_LIMIT" ]; then
              echo "::error::the in-flight compile has not changed stage in $((STALLED/60)) minutes."
              echo "A working compile keeps opening and closing stages; this one has stopped."
              echo "Investigate before rolling, or re-run with force_roll=true to roll over it."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::drained for 60 minutes and the worker is still busy."
              echo "The compile was still PROGRESSING, so this is a ceiling, not a stall."
              echo "Re-run when it finishes, or force_roll=true to roll over it."
              exit 1
            fi
            echo "in-flight compile still finishing (stage moved $((STALLED/60))m ago) — checking again in 60s..."
            sleep 60
          done

      - name: Roll the WARM worker Container App (the real queue consumer)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # parser-os-worker-warm is a long-running Container App that consumes the
          # compile queue and grabs each message before the cold-start Job. It was
          # NEVER updated by deploys -> it silently ran stale code. Roll it to the
          # same digest every deploy. `--image` preserves its env vars + CPU/memory.
          az containerapp update \
            --name parser-os-worker-warm \
            --resource-group ${{ env.JOB_RG }} \
            --image "${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.img.outputs.digest }}"

          # The update returns when the NEW revision is provisioned, not when
          # the OLD replicas are gone. Live 2026-09-03 19:02: the sentinel was
          # removed 40s after the roll began, an old replica still polling in
          # its shutdown window took a priority message, and was killed with
          # it -- the deal sat "running" for the full 30-minute lease. Keep the
          # sentinel until every previous revision reports zero replicas, so a
          # dying replica cannot take work. Bounded; fail open into the removal
          # step (a sentinel left behind is the worse failure).
          for i in $(seq 1 30); do
            OLD=$(az containerapp revision list -n parser-os-worker-warm -g "${{ env.JOB_RG }}" --all \
                    --query "sum([?properties.active==\`false\`].properties.replicas)" -o tsv 2>/dev/null || echo 0)
            if [ "${OLD:-0}" = "0" ] || [ "${OLD:-0}" = "None" ]; then
              echo "previous revisions have no replicas left — safe to lift the drain."; break
            fi
            echo "previous revisions still have ${OLD} replica(s) shutting down — keeping the drain sentinel (check $i/30)..."
            sleep 10
          done

      - name: Remove the drain sentinel
        # always(): a sentinel left behind would silently stop the worker taking
        # ANY new work — a stalled pipeline nobody is watching, which is worse
        # than the interrupted compile this whole mechanism exists to prevent.
        if: always()
        run: |
          az storage blob delete --account-name purpulsedevstg01 \
            --container-name orbitbrief-artifacts \
            --name control/parser-os-worker.drain \
            --auth-mode login --only-show-errors -o none 2>/dev/null || true
          echo "drain sentinel removed"

      - name: Verify the rolled image stamps the expected parser-os SHA
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Run the image once (no queue message -> it just prints its baked SHAs
          # and exits) and assert PARSER_OS_SHA matches what we bundled. Fails the
          # deploy loudly instead of silently shipping stale code.
          EXPECTED="${{ steps.pos.outputs.sha }}"
          GOT=$(az containerapp job show --name ${{ env.JOB_NAME }} --resource-group ${{ env.JOB_RG }} \
            --query "properties.template.containers[0].image" -o tsv)
          echo "Job now points at: $GOT"
          echo "Bundled parser-os SHA (expected baked): $EXPECTED"
          echo "Next compile message will run on this image."
