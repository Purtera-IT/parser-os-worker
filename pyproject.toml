[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parser-os-worker"
version = "0.1.0"
description = "Queue-driven worker for parser-os heavy compile jobs (offloaded from HTTP path)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # Worker imports parser-os to run compile_project().  Pinned to same tag
  # parser-os-service uses so a single bump moves both.
  "purtera-evidence-mvp @ git+https://github.com/Purtera-IT/parser-os.git@v45.2",
  # Azure SDKs
  "azure-identity>=1.15",
  "azure-storage-queue>=12.10",
  "azure-storage-blob>=12.19",
  # Logging / config
  "structlog>=24.1",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "mypy>=1.8",
  "httpx>=0.27",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
parser-os-worker = "parser_os_worker.main:main"
